[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
serviceName = "sri-lanka-gov-api"

[services.source]
repo = "AseshNemal/Gov-Dashboard"
rootDirectory = "Gov-data-simulator/backend"
branch = "main"

[services.variables]
PORT = "8000"
PYTHONPATH = "/app"
ENVIRONMENT = "production"
